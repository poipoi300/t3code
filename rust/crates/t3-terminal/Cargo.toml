[package]
name = "t3-terminal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
t3-contracts = { path = "../t3-contracts" }
t3-process = { path = "../t3-process" }
portable-pty = "0.9.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
tempfile = "3"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
win32job = "2.1.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "fs"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["test-util", "net", "io-util"] }

[lints]
workspace = true
