[workspace]
resolver = "3"

[package]
name = "t3-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# The authoritative NSH pin. The installer reads nsh-core; keep all NSH crates identical.
[dependencies]
nsh-core = { git = "https://github.com/poipoi300/nsh", rev = "70d98da725fa54c8822caabf8de8571a6ead55a1" }
nsh-base = { git = "https://github.com/poipoi300/nsh", rev = "70d98da725fa54c8822caabf8de8571a6ead55a1", default-features = false, features = ["highlight", "rich-editor", "editor", "term"] }
t3-client = { path = "../t3-client" }
t3-contracts = { path = "../t3-contracts" }
t3-theme = { path = "../t3-theme" }
t3-i18n = { path = "../t3-i18n", default-features = false, features = ["iana"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# raw_value: SH-ROUTES validates project keys as JSON without rejecting overflowing numbers.
serde_json = { version = "1", features = ["raw_value"] }
percent-encoding = "2"
# UI-QR: Project Nayuki's encoder, the library apps/web vendors as packages/shared/src/qrCode.ts.
qrcodegen = "1.8"
t3-platform = { path = "../t3-platform" }
log = "0.4"
# TL-BLOCKS-2's code tokenizer: the versions and features nsh-base's `highlight` already builds.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }

# The client's network and storage runtime on native hosts (`runtime/client.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }

[target.'cfg(target_os = "android")'.dependencies]
nsh-platform-android = { git = "https://github.com/poipoi300/nsh", rev = "70d98da725fa54c8822caabf8de8571a6ead55a1", default-features = false }

[dev-dependencies]
# The connectable fake environment (`t3_client::testing::environment`) for UI tests only.
t3-client = { path = "../t3-client", features = ["testing"] }
futures = { version = "0.3", features = ["executor"] }
nsh-engine = { git = "https://github.com/poipoi300/nsh", rev = "70d98da725fa54c8822caabf8de8571a6ead55a1" }
nsh-testing = { git = "https://github.com/poipoi300/nsh", rev = "70d98da725fa54c8822caabf8de8571a6ead55a1", default-features = false }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2
