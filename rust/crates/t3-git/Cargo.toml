[package]
name = "t3-git"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
t3-process = { path = "../t3-process" }
t3-contracts = { path = "../t3-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = "0.1"
url = "2"
unicode-normalization = "0.1"
notify = "8"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync", "time", "macros", "rt"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
filetime = "0.2"
icu_collator = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "net", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Storage_FileSystem"] }
# Volume serial number and file index from a handle (repository identity), without unsafe code.
cap-std = "3"
cap-fs-ext = "3"

[target.'cfg(windows)'.dev-dependencies]
junction = "2"

[lints]
workspace = true
