[package]
name = "t3-pull-request"
version = "0.1.0"
edition = "2024"
publish = false
[features]
default = []
forge = ["dep:t3-forge", "dep:tempfile"]
sqlite = ["dep:t3-persistence"]
orchestration = ["dep:t3-orchestration"]

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
regex = "1"
chrono = "0.4"
icu_collator = "2"
tempfile = { version = "3", optional = true }
t3-contracts = { path = "../t3-contracts" }
t3-forge = { path = "../t3-forge", optional = true }
t3-persistence = { path = "../t3-persistence", optional = true }
t3-orchestration = { path = "../t3-orchestration", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
