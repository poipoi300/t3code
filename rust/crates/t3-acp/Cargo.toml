[package]
name = "t3-acp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
agent-client-protocol = { version = "=5.2.0", features = ["unstable", "unstable_protocol_v2"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
tokio-util = { version = "0.7", features = ["compat"] }

[lints]
workspace = true
