[package]
name = "t3-claude-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
serde_stacker = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "sync", "rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
futures-core = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "sync", "rt-multi-thread", "macros", "process", "fs", "time", "test-util"] }

[lints]
workspace = true
