[package]
name = "t3-process"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
process-wrap = { version = "10", features = ["tokio1"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }
win32job = "2.1.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "net"] }

[lints]
workspace = true
