[package]
name = "t3-auth"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
t3-contracts = { path = "../t3-contracts" }
t3-persistence = { path = "../t3-persistence" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
chrono = "0.4"
base64 = "0.22"
base16ct = { version = "0.2", features = ["alloc"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
getrandom = "0.3"
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
p256 = { version = "0.13", features = ["ecdsa"] }
dunce = "1"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.40", features = ["functions"] }
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
