[package]
name = "t3-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[features]
# The assembled domain services the `t3` binary serves.
default = ["local-services", "workspace", "terminal", "git", "scheduler", "usage", "orchestration", "host", "project", "device", "providers", "preview", "cloud", "forge", "pull-requests", "textgen", "git-actions", "mcp", "textgen-native", "storage-cleanup"]
local-services = [
    "dep:t3-auth",
    "dep:t3-host",
    "dep:t3-config",
    "dep:t3-persistence",
    "dep:clap",
    "dep:qrcodegen",
    "dep:if-addrs",
    "dep:reqwest",
    "dep:t3-telemetry",
]
orchestration = ["dep:t3-orchestration", "dep:t3-persistence", "t3-orchestration/git-backend", "t3-orchestration/acp-adapter", "dep:t3-git", "dep:async-trait"]
workspace = ["dep:t3-git"]
git = ["dep:t3-git", "dep:t3-shared", "dep:async-trait"]
forge = ["dep:t3-forge", "local-services", "git", "workspace", "dep:t3-process", "dep:async-trait"]
terminal = ["dep:t3-terminal"]
scheduler = ["dep:t3-scheduler", "dep:async-trait", "dep:t3-shared"]
usage = ["dep:t3-usage", "dep:sysinfo"]
host = ["dep:t3-host", "dep:sysinfo", "dep:async-trait"]
storage-cleanup = ["host", "orchestration", "local-services", "terminal"]
cloud = ["dep:t3-cloud", "host", "local-services"]
device = ["dep:t3-device", "dep:t3-provider", "dep:t3-process", "local-services", "workspace", "dep:async-trait"]
preview = ["dep:t3-preview", "local-services", "dep:sysinfo"]
pull-requests = ["dep:t3-pull-request", "t3-pull-request/forge", "t3-pull-request/sqlite", "t3-pull-request/orchestration", "forge", "project", "local-services", "dep:async-trait"]
# Generated text over the configured model APIs, and the runtime's title port (`adapters/textgen.rs`).
textgen = ["dep:t3-textgen", "t3-textgen/orchestration-host", "orchestration", "local-services", "dep:t3-shared", "dep:async-trait"]
# `git.runStackedAction` and `git.preparePullRequestThread`, and the project setup runner.
git-actions = ["textgen", "forge", "project", "pull-requests", "terminal", "dep:t3-terminal"]
# Honours the `T3CODE_DEV_MANAGED_*` policy overrides in a debug build. Never a default and
# never in a shipped binary: it lets a user point the policy reader away from the machine's
# policy. Tests get it through the `t3-config` dev-dependency below.
dev-policy-overrides = ["t3-config?/dev-policy-overrides"]
# Provider-native text generation (Codex, Claude), review guides and title link context.
textgen-native = ["git-actions", "providers"]
project = ["dep:t3-project", "orchestration", "workspace", "dep:t3-process", "dep:async-trait"]
# The `/mcp` endpoint and per-thread provider credentials (`adapters/mcp.rs`).
mcp = ["dep:t3-mcp", "t3-mcp/orchestration", "t3-mcp/git", "t3-mcp/scheduler", "local-services", "orchestration", "dep:async-trait", "dep:t3-shared", "t3-device?/mcp"]
providers = ["host", "usage", "dep:t3-shared", "dep:t3-provider", "dep:t3-process", "local-services", "workspace", "orchestration", "dep:async-trait", "t3-orchestration/codex-adapter", "t3-orchestration/claude-adapter", "dep:t3-codex-app-server", "dep:t3-claude-cli", "dep:base64"]
[dependencies]
t3-contracts = { path = "../t3-contracts" }
t3-telemetry = {path="../t3-telemetry",optional=true}
t3-rpc = { path = "../t3-rpc" }
t3-auth = { path = "../t3-auth", optional = true }
t3-config = { path = "../t3-config", optional = true }
t3-persistence = { path = "../t3-persistence", optional = true }
t3-orchestration = { path = "../t3-orchestration", optional = true }
t3-workspace = { path = "../t3-workspace" }
t3-git = { path = "../t3-git", optional = true }
t3-shared = { path = "../t3-shared", optional = true }
t3-forge = { path = "../t3-forge", optional = true }
t3-terminal = { path = "../t3-terminal", optional = true }
t3-scheduler = { path = "../t3-scheduler", optional = true }
t3-usage = { path = "../t3-usage", optional = true }
t3-host = { path = "../t3-host", optional = true }
t3-project = { path = "../t3-project", optional = true }
t3-pull-request = { path = "../t3-pull-request", optional = true }
t3-textgen = { path = "../t3-textgen", optional = true }
t3-device = { path = "../t3-device", optional = true }
# Connect needs the concrete auth issuer (`auth`); `orchestration` is the native peer store.
t3-cloud = { path = "../t3-cloud", features = ["auth", "orchestration"], optional = true }
t3-preview = { path = "../t3-preview", optional = true }
t3-mcp = { path = "../t3-mcp", optional = true }
t3-provider = { path = "../t3-provider", optional = true }
t3-process = { path = "../t3-process", optional = true }
t3-acp = { path = "../t3-acp", optional = true }
t3-codex-app-server = { path = "../t3-codex-app-server", optional = true }
t3-claude-cli = { path = "../t3-claude-cli", optional = true }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
futures = "0.3"
tracing = "0.1"
clap = { version = "4.5", optional = true }
qrcodegen = { version = "1.8", optional = true }
if-addrs = { version = "0.14", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
async-trait = { version = "0.1", optional = true }
base64 = { version = "0.22", optional = true }
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"], optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter", "std"] }
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
url = "2"
mime_guess = "2"
percent-encoding = "2"
httpdate = "1"
tower-http = {version = "0.6", features = ["cors", "compression-gzip", "timeout"]}
tower = { version = "0.5", features = ["util"] }
# The version axum 0.8 uses, so its WebSocket errors can be matched by type.
tungstenite = { version = "0.29", default-features = false }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2", "service"] }
[dev-dependencies]
# Pair the production native review client with the server’s bound-checkout HTTP fixture.
t3-client = { path = "../t3-client" }
t3-platform = { path = "../t3-platform" }
# Observe a blocked launch reservation in the socket race test.
t3-orchestration = { path = "../t3-orchestration", features = ["testkit"] }
# Turns the managed-policy overrides on for this crate's tests only (not for `cargo build`).
t3-config = { path = "../t3-config", features = ["dev-policy-overrides"] }
p256 = { version = "0.13", features = ["ecdsa"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
tempfile = "3"
# The injected scheduled-task clock in `composition_scheduler_usage`.
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.28"
tokio = { version = "1", features = ["process"] }
# Its own `main`: the test binary doubles as the fake provider CLI it launches.
[[test]]
name = "composition_mcp_native"
harness = false
required-features = ["providers", "mcp"]

[[test]]
name = "native_providers"
harness = false
required-features = ["providers"]

# Its own `main`: the test binary doubles as the fake ACP registry agent it launches.
[[test]]
name = "composition_acp_registry"
harness = false
required-features = ["providers"]

# Its own `main`: the test binary doubles as the fake `codex` and `claude` it launches.
[[test]]
name = "textgen_native"
harness = false
required-features = ["textgen-native"]

[[bin]]
name = "t3"
path = "src/bin/t3.rs"
required-features = ["local-services"]

[target.'cfg(unix)'.dependencies]
filedescriptor = "0.8.3"
nix = { version = "0.29", features = ["fs"] }
rustix = { version = "1", features = ["process"] }

[target.'cfg(all(windows, target_env = "msvc"))'.dependencies]
# The bootstrap descriptor reader, `src/cli/bootstrap/windows.rs`: the only unsafe code in this crate.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[target.'cfg(windows)'.dependencies]
# The Documents known folder (PowerShell profiles), for clone destinations (`adapters/forge.rs`).
dirs = "5"
