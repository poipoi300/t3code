[package]
name = "t3-cloud"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
auth = ["dep:t3-auth"]
orchestration = ["dep:t3-orchestration"]

[dependencies]
t3-contracts = { path = "../t3-contracts" }
t3-process = { path = "../t3-process" }
t3-config = { path = "../t3-config" }
t3-persistence = { path = "../t3-persistence" }
t3-auth = { path = "../t3-auth", optional = true }
t3-orchestration = { path = "../t3-orchestration", optional = true, default-features = false }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util", "net", "fs"] }
tokio-stream = "0.1"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
zeroize = "1"
getrandom = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
url = "2"
httpdate = "1"
percent-encoding = "2"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
p256 = { version = "0.13", features = ["ecdsa"] }

[lints]
workspace = true
