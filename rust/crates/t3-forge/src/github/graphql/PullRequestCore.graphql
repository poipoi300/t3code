query PullRequestCore(
  $owner: String!
  $name: String!
  $number: Int!
  $headRef: String!
  $required: Boolean!
  $requestedReviewers: Int!
  $mergeQueue: Boolean!
) {
  repository(owner: $owner, name: $name) {
    mergeCommitAllowed
    squashMergeAllowed
    rebaseMergeAllowed
    autoMergeAllowed
    viewerPermission
    pullRequest(number: $number) {
      number
      title
      url
      body
      state
      isDraft
      mergeable
      mergeStateStatus
      reviewDecision
      additions
      deletions
      changedFiles
      createdAt
      updatedAt
      mergedAt
      closedAt
      headRefName
      baseRefName
      headRefOid
      isCrossRepository
      maintainerCanModify
      headRepositoryOwner {
        __typename
        login
      }
      
      
      headRepository {
        nameWithOwner
        viewerPermission
      }
      headRef {
        id
      }
      author {
        login
        avatarUrl
        ... on User {
          id
          name
        }
      }
      autoMergeRequest {
        mergeMethod
      }
      
      
      mergeQueueRemovals: timelineItems(last: 1, itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT])
        @include(if: $mergeQueue) {
        nodes {
          ... on RemovedFromMergeQueueEvent {
            id
            createdAt
            reason
          }
        }
      }
      viewerCanUpdate
      viewerDidAuthor
      viewerCanUpdateBranch
      baseRef {
        compare(headRef: $headRef) {
          behindBy
        }
      }
      reviewRequests(first: $requestedReviewers) {
        nodes {
          requestedReviewer {
            ... on User {
              login
              name
            }
            ... on Bot {
              login
            }
            
            
            ... on Team {
              slug
              combinedSlug
              teamName: name
              teamAvatarUrl: avatarUrl
            }
          }
        }
      }
      labels(first: 100) {
        nodes {
          name
          color
          description
        }
      }
      commits(last: 1) {
        nodes {
          commit {
            statusCheckRollup {
              contexts(first: 100) {
                nodes {
                  ...CheckContext
                }
                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment CheckContext on StatusCheckRollupContext {
  ... on StatusContext {
    context
    state
    targetUrl
    createdAt
    description
    isRequired(pullRequestNumber: $number) @include(if: $required)
  }
  ... on CheckRun {
    name
    status
    conclusion
    startedAt
    completedAt
    detailsUrl
    isRequired(pullRequestNumber: $number) @include(if: $required)
    checkSuite {
      workflowRun {
        workflow {
          name
        }
      }
    }
  }
}
