query PullRequestCheckContexts(
  $owner: String!
  $name: String!
  $number: Int!
  $required: Boolean!
  $after: String
) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      headRefOid
      commits(last: 1) {
        nodes {
          commit {
            statusCheckRollup {
              contexts(first: 100, after: $after) {
                nodes {
                  ...CheckContext
                }
                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment CheckContext on StatusCheckRollupContext {
  ... on StatusContext {
    context
    state
    targetUrl
    createdAt
    description
    isRequired(pullRequestNumber: $number) @include(if: $required)
  }
  ... on CheckRun {
    name
    status
    conclusion
    startedAt
    completedAt
    detailsUrl
    isRequired(pullRequestNumber: $number) @include(if: $required)
    checkSuite {
      workflowRun {
        workflow {
          name
        }
      }
    }
  }
}
