query RepositoryReferences(
  $owner: String!
  $name: String!
  $q: String!
  $number: Int!
  $exact: Boolean!
) {
  search(query: $q, type: ISSUE, first: 20) {
    pageInfo {
      hasNextPage
    }
    nodes {
      ...ReferenceCandidate
    }
  }
  repository(owner: $owner, name: $name) @include(if: $exact) {
    issueOrPullRequest(number: $number) {
      ...ReferenceCandidate
    }
  }
}

fragment ReferenceCandidate on IssueOrPullRequest {
  __typename
  ... on Issue {
    number
    title
    issueState: state
  }
  ... on PullRequest {
    number
    title
    pullRequestState: state
  }
}
