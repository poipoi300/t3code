mutation DisablePullRequestAutoMerge($pullRequestId: ID!) {
  disablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId }) {
    pullRequest {
      ...PullRequestActionSummary
    }
  }
}

fragment PullRequestActionSummary on PullRequest {
  number
  title
  url
  headRefName
  baseRefName
  state
  isDraft
  updatedAt
  mergedAt
  closedAt
  headRefOid
  author {
    login
    avatarUrl
    ... on User {
      name
    }
  }
  autoMergeRequest {
    mergeMethod
  }
}
