[package]
name = "t3-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
t3-contracts = { path = "../t3-contracts" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"
t3-config = { path = "../t3-config" }
t3-process = { path = "../t3-process" }
t3-workspace = { path = "../t3-workspace" }
t3-git = { path = "../t3-git" }
t3-provider = { path = "../t3-provider" }
t3-cloud = { path = "../t3-cloud" }
t3-persistence = { path = "../t3-persistence" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
base64 = "0.22"
futures-util = "0.3"
async-trait = "0.1"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
hex = "0.4"
tempfile = "3"
dunce = "1"
cap-std = "3.4.6"
cap-fs-ext = "3.4.6"
regex = "1"
tar = "0.4"
flate2 = "1"
serde_yaml_ng = "0.10"
notify = "8"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
tempfile = "3"
filetime = "0.2"

[lints.rust]
unsafe_code = "deny"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
junction = "2"

