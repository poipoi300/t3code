[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/t3-ui", "shells"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/pingdotgg/t3code"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# Debug info is most of a dev build's size; many checkouts build in parallel.
[profile.dev]
debug = false
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
