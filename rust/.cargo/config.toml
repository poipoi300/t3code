# Portable build settings for every workspace under rust/ (the main workspace,
# crates/t3-ui and shells). Machine-local settings (job count, a rustc wrapper,
# cache locations) belong in an untracked .cargo/config.toml in a parent
# directory, which cargo merges with this file, or in CARGO_BUILD_JOBS and
# RUSTC_WRAPPER.

# Full debug information made each build directory 15 to 45 GB (PDBs for every
# test binary, type records in every rlib) and filled the build disk within
# hours. Line tables keep backtraces readable; dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
