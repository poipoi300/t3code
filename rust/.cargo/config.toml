# Many checkouts and agents build this workspace at once on one machine. With
# the default (one rustc per core) twenty concurrent builds exhausted the
# system's commit memory and took other processes down; at four jobs and 27
# concurrent builds it was down to 10 GB free again. Override per command with
# `--jobs` or `CARGO_BUILD_JOBS` on a quiet machine.
[build]
jobs = 2
# Twenty-odd build directories compile the same dependencies. sccache shares the
# ones it can across them (measured: about a third; crates downstream of a
# proc macro miss on Windows). It never caches the workspace's own edited crates.
#
# rustc-gate (source in the coordinator's notes, tools\rustc-gate\gate.rs) runs
# sccache after two bounded waits: at most five compiles of the heaviest crates
# machine-wide, and no new compile while free commit memory is under a floor.
# Machine-specific, like the paths below: replace before this branch is shared.
rustc-wrapper = "D:\\t3code-tools\\rustc-gate.exe"

[env]
SCCACHE_DIR = "D:\\sccache"
SCCACHE_CACHE_SIZE = "80G"
SCCACHE_IDLE_TIMEOUT = "0"
